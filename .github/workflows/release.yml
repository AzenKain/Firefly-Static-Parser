name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --bin firefly-static-parser

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/firefly-static-parser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
